name: Build Garuda Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Garuda-Launcher
          path: dist/launcher.exe
